# Mini CRM build 20261121212119 (generated by deploy/make-compose.sh)
services:
  minicrm:
    image: nginx:1.27-alpine
    container_name: minicrm
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -rf /usr/share/nginx/html/* && base64 -d /site.b64 | tar -xz -C /usr/share/nginx/html && exec nginx -g 'daemon off;'"]
    configs:
      - source: site
        target: /site.b64
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - marta_school_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  marta_school_default:
    external: true
configs:
  nginx:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
      
          gzip on;
          gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
      
          add_header X-Content-Type-Options nosniff always;
          add_header Referrer-Policy strict-origin-when-cross-origin always;
      
          # завжди перевіряти оновлення коду (щоб нові версії одразу доходили до телефонів)
          location ~* \.(html|js|css|json)$$ {
              add_header Cache-Control "no-cache" always;
              add_header X-Content-Type-Options nosniff always;
          }
          location = /sw.js {
              add_header Cache-Control "no-cache, no-store" always;
              add_header Service-Worker-Allowed "/" always;
          }
          location /icons/ {
              add_header Cache-Control "public, max-age=604800" always;
          }
          location = /health { access_log off; return 200 "ok\n"; }
          location / { try_files $$uri $$uri/ /index.html; }
      }
  site:
    content: ""
