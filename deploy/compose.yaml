# Mini CRM — Docker-проєкт для Hostinger VPS (Docker Manager)
# Домен 1.decostyle.com.ua проксує спільний Caddy (мережа marta_school_default → minicrm:80).
# Секрети (OWNER_EMAIL, OWNER_PASSWORD) задаються в Environment проєкту, не в цьому файлі.
x-env: &env
  APP_NAME: "Mini CRM"
  APP_URL: "https://1.decostyle.com.ua"
  APP_LOCALE: "uk"
  OWNER_EMAIL: ${OWNER_EMAIL:-}
  OWNER_PASSWORD: ${OWNER_PASSWORD:-}
  SESSION_LIFETIME: "43200"
  SESSION_SECURE_COOKIE: "true"
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"

services:
  minicrm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: minicrm:latest
    container_name: minicrm
    restart: unless-stopped
    environment:
      <<: *env
    volumes:
      - minicrm_data:/data
    networks:
      - default
      - marta_school_default
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: minicrm:latest
    container_name: minicrm-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    environment:
      <<: *env
      RUN_MIGRATIONS: "0"
    volumes:
      - minicrm_data:/data
    depends_on:
      minicrm:
        condition: service_healthy

volumes:
  minicrm_data:
    name: minicrm_data

networks:
  marta_school_default:
    external: true
