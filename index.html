<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mini CRM">
  <meta name="description" content="Особисті фінанси, повідомлення, справи та ліди в одному додатку">
  <title>Mini CRM</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="screenTitle">Головна</h1>
    <button class="icon-btn" id="settingsBtn" aria-label="Налаштування">⚙️</button>
  </header>

  <main id="view" class="view"></main>

  <button class="fab" id="fab" aria-label="Додати">＋</button>

  <nav class="tabbar">
    <button data-tab="home" class="active"><span>🏠</span>Головна</button>
    <button data-tab="finance"><span>💰</span>Фінанси</button>
    <button data-tab="messages"><span>💬</span>Повідомл.<i class="badge" id="msgBadge" hidden></i></button>
    <button data-tab="tasks"><span>✅</span>Справи</button>
    <button data-tab="leads"><span>🎯</span>Ліди<i class="badge" id="leadBadge" hidden></i></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
